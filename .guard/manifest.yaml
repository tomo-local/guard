apiVersion: ai-guard/v1
kind: GuardManifest
metadata:
  name: default-rules
spec:
  # Fallback behind the per-tool policies in .guard/policies/: it only decides
  # commands those policies have no opinion on, by the paths the command touches.
  commandGate:
    target:
      action: DENY            # used by rules that don't set their own action
    rules:
      - to:
          label: cmd-dir
          paths:
            anyOf:
              - "/cmd/*"
        message:
          reason: "No policy matched {cmd}, which touches /cmd; denying by default."
          next: "Add an explicit allow/deny rule under .guard/policies/ for this command."
      - to:
          label: src-dir
          paths:
            anyOf:
              - "/src/*"
        action: CONFIRM
        message:
          reason: "{cmd} is a write operation under /src."
          next: "Confirm with the user before proceeding."
  # Labels branches for `to.branch` conditions in policy rules (`main`,
  # `protected`); the repository is matched by its origin URL.
  repositoryGate:
    repose:
      - name: tomo-local/aaaaa
        main: main
        protected:
          - main
          - development
          - staging
      - name: tomo-local/test
        main: development
        protected:
          - development
          - production
          - staging
          - docs/*
  # SQL rules that apply whatever the environment (db/policy.yml, by label,
  # decides first). Same shape as the policy rules, without labels.
  sqlGate:
    target:
      clients: [psql, mysql]
      action: DENY
    rules:
      - to:
          label: destructive
          functions: [DROP, TRUNCATE]
        action: DENY
        message:
          reason: "{cmd} drops or empties a table."
          next: "Ask the user to run it themselves."
      - to:
          label: unreadable
          functions: [UNKNOWN]          # script files, standard input, interactive sessions
        action: CONFIRM
        message:
          reason: "{cmd} runs SQL that guard can't read from the command line."
          next: "Confirm with the user before proceeding."
