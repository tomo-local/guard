apiVersion: ai-guard/v1
kind: GuardManifest
metadata:
  name: default-rules
spec:
  # Fallback behind the per-tool policies in .guard/policies/: it only decides
  # commands those policies have no opinion on, by the paths the command touches.
  commandGate:
    target:
      action: DENY            # used by rules that don't set their own action
    rules:
      - to:
          label: cmd-dir
          paths:
            anyOf:
              - "/cmd/*"
        message:
          reason: "No policy matched {cmd}, which touches /cmd; denying by default."
          next: "Add an explicit allow/deny rule under .guard/policies/ for this command."
      - to:
          label: src-dir
          paths:
            anyOf:
              - "/src/*"
        action: CONFIRM
        message:
          reason: "{cmd} is a write operation under /src."
          next: "Confirm with the user before proceeding."
  # Read but not enforced yet.
  repositoryGate:
    repose:
      - name: tomo-local/aaaaa
        main: main
        protected:
          - main
          - development
          - staging
      - name: tomo-local/test
        main: development
        protected:
          - development
          - production
          - staging
          - docs/*
  sqlGate:
    target:
      module: permission
      action: DENY
