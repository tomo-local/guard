apiVersion: ai-guard/v1
kind: CommandGatePolicy
metadata:
  name: curl-confirm
spec:
  target:
    module: permission
    tool: curl
  action: CONFIRM
  rules:
    - to:
        label: network
      message:
        reason: "{cmd} accesses an external network resource."
        next: "Confirm the URL is safe with the user before proceeding."
