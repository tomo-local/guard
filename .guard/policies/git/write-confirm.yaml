apiVersion: ai-guard/v1
kind: CommandGatePolicy
metadata:
  name: git-write-confirm
spec:
  target:
    module: permission
    tool: git
  action: CONFIRM
  rules:
    - to:
        label: write
        functions: [add, commit, pull, merge]
      message:
        reason: "{cmd} is a write operation."
        next: "Confirm with the user before proceeding."

    # push -f/--force is owned by push-force-deny.yaml; stepping aside keeps
    # one command decided by exactly one policy.
    - to:
        label: write
        functions: [push]
        args:
          noneOf: ["-f", "--force"]
      message:
        reason: "{cmd} is a write operation."
        next: "Confirm with the user before proceeding."
