apiVersion: ai-guard/v1
kind: GuardDBConnections
metadata:
  name: connections
spec:
  # Which environment a database connection belongs to, and the labels
  # .guard/db/policy.yml refers to. Each way of connecting has its own block
  # under the environment: cli matches the host and/or database of a psql /
  # mysql command (path.Match patterns, case-insensitive). Replace the example
  # hosts with your own.
  environments:
    - name: production
      labels: [prod]
      cli:
        hosts: ["*.prod.example.com"]
    - name: staging
      labels: [stage]
      cli:
        hosts: ["*.staging.example.com"]
    - name: local
      labels: [dev]
      cli:
        hosts: [localhost, 127.0.0.1]
