apiVersion: ai-guard/v1
kind: GuardDBPolicy
metadata:
  name: db-policy
spec:
  # SQL rules by the labels of the environment (see connections.yml). Like the
  # per-tool policies: a rule that lists the statement's keyword wins over a
  # catch-all rule (no functions) for the same labels.
  target:
    clients: [psql, mysql]
    action: DENY             # used by rules that don't set their own action
  rules:
    - to:
        label: prod-schema
        labels: [prod]
        functions: [DROP, TRUNCATE, ALTER]
      action: DENY
      message:
        reason: "{cmd} changes the schema of a production database."
        next: "Ask the user to run it themselves."
    - to:
        label: prod-read
        labels: [prod]
        functions: [SELECT, SHOW, EXPLAIN]
      action: ALLOW
    - to:
        label: prod-other
        labels: [prod]
      action: CONFIRM
      message:
        reason: "{cmd} runs SQL against a production database."
        next: "Confirm with the user before proceeding."
    - to:
        label: stage-write
        labels: [stage]
        functions: [DROP, TRUNCATE, DELETE, UPDATE]
      action: CONFIRM
